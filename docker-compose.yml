# Start:  cp .env.example .env   then   docker compose up -d      UI: http://localhost:8080
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Toronto}
      FRED_API_KEY: ${FRED_API_KEY:-}
      REFRESH_SCALE: ${REFRESH_SCALE:-1}
      TRANSCRIPT_SCAN_MINUTES: ${TRANSCRIPT_SCAN_MINUTES:-5}
    volumes:
      - ./config:/app/config                                                  # alerts.yaml, indicators.yaml, notes.yaml, manual_inputs.yaml
      - appdata:/data                                                         # SQLite database
      - ${TRANSCRIPTS_HOST_PATH:-./transcripts}:/data/transcripts:ro          # transcripts (<video_id>.txt) - read-only, re-indexed every few minutes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:80"

volumes:
  appdata:
