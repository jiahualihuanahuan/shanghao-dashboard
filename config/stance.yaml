latest:
  episode: 63vcms-Sw6w
  headline: "Short-term liquidity shock, not a fundamental AI top: stays constructive on AI/semis, wary of banks and financials."
  points:
    - text: "The Oct-Nov selloff is a liquidity shock that started in rates (oil-linked rate volatility after the Fed stopped managing the long end), spread to bonds/FX/European credit and then to AI equities; OpenAI and Anthropic fund-raises drained equity liquidity."
      episode: 63vcms-Sw6w
    - text: "Positioning and valuation are 'very empty': semis hedge-fund net exposure negative, buy/sell (long/short) ratio at a 10-year low comparable to the early-2026 Iran shock and the 2025 tariff shock; the market is in a 'downward bubble'. Very low positioning sets up violent rebounds."
      episode: ZPJgzAP-iqU
    - text: "After the Democratic sweep (as ASR heard it, including Texas) he sees three macro-liquidity risks: tighter regulation/pressure on the Fed (Warren on the banking committee), Warsh unwilling to support the long end with QE while Congress blocks deregulation, and a government shutdown."
      episode: 63vcms-Sw6w
    - text: "Liquidity should repair in steps: Iran easing -> oil down -> rate vol down -> credit buyers return -> liquidity. Expects multiple compression to continue (S&P around 20x instead of 23-24x even with rising earnings); most pessimistic on banks/financials, not on semis."
      episode: 63vcms-Sw6w
    - text: "AI demand: token demand is still far above supply ('beginning of the beginning'); coding demand (~300 bn) has not peaked; industry forward compute is priced in contango while public markets discount it; memory is cyclical - best case it holds current prices."
      episode: ZPJgzAP-iqU
  would_change_mind:
    - text: "A second round of war / oil spike re-igniting the oil -> rates -> liquidity chain."
      episode: ZPJgzAP-iqU
    - text: "Liquidity tightness persisting long enough to spread beyond AI/semis to Apple, Walmart and the broad S&P."
      episode: ZPJgzAP-iqU
    - text: "Evidence that token demand / AI revenue really stalls (he argues the 2027-28 doubts are being over-priced while liquidity is thin)."
      episode: 63vcms-Sw6w

