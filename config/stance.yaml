framework:
  - topic: T1
    text: "Liquidity first: Treasury issuance in DV01 terms, long-end supply, TGA, bank balance sheets (eSLR), GS FCI, and above all rate volatility (convexity / MBS hedging, swaptions)."
  - topic: T4
    text: "Positioning and flows: CTA/systematic trigger levels and expected buying/selling, short-vol funds, prime-broker net/gross leverage, long/short ratio, leveraged ETFs and retail."
  - topic: T5
    text: "Valuation: forward P/E of the S&P and of AI/semis vs growth; 'low-P/E bubble' (cheap multiples hiding leverage and crowding)."
  - topic: T3
    text: "Fed and labour: payrolls over unemployment, Fed reaction function, market pricing vs dot plot; 2026: Warsh hands the long end to the market."
  - topic: T6
    text: "AI cycle: token demand vs compute supply, hyperscaler capex, payback (~2.2 years per data centre), memory/optical cycles, power and permitting."
  - topic: T2
    text: "Credit: AI financing (neoclouds, IG issuance, CDS of hyperscalers), private credit, refinancing wall around 2028, European sovereign spreads (France)."
  - topic: T7
    text: "Tariffs: effective tariff rate -> PCE (roughly tariff increase / 10), core PCE tariff contribution."
  - topic: T8
    text: "Energy/geopolitics: Iran, Hormuz, crude vs diesel crack, strategic reserves."
  - topic: T10
    text: "Japan/FX/crypto: yen carry trade, JGB yields, dollar as a 'US-equity dollar', bitcoin as a pure liquidity asset."

