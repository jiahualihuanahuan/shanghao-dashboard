# Maps each dashboard indicator to the keywords used to find what he said about it in the transcripts.
# Keywords are regexes (case-insensitive). The transcripts are automatic speech-to-text (faster-whisper "small"),
# which garbles English finance terms - so common mis-hearings are listed too (e.g. "compressorly" = convexity).
# min_hits = distinct keywords that must appear in a ~3-line window for it to count.
topics:
  T1: Liquidity & rates
  T2: Credit & funding
  T3: Fed & labor
  T4: Positioning & flows
  T5: Valuation
  T6: AI & semiconductors
  T7: Tariffs & trade
  T8: Energy & geopolitics
  T9: Politics & policy
  T10: Japan, FX & crypto

indicators:
  rates_10y:
    title: US long-end yields (10Y/30Y)
    topic: T1
    min_hits: 1
    keywords: ["十年期", "10年期", "10年利率", "长端", "long.?end", "10.?year", "5\\.5", "国债拍卖", "国债供应", "term premium", "长期利率"]
